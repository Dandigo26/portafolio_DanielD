      <main>
         <form name="formulario" id="formulario" action="https://formspree.io/f/xnjbbkal" method="post" target="_blank" autocomplete="on">
             <p class="solicitarPresupuesto">
               Si necesitas un presupuesto a medida o simplemente quieres saludar, rellena el formulario y te responderé lo antes posible.
             </p>
             <div class="grupoFormulario">
                 <label for="nombre">Nombre:</label>
                 <input type="text" id="nombre" name="nombre" value="" size="25" required>
             </div>
             <div class="grupoFormulario">
                 <label for="email">Email:</label>
                 <input type="email" id="email" name="email" value="" size="25" required>
             </div>
             <div class="grupoFormulario">
                 <label for="telefono">Teléfono:</label>
                 <input type="tel" id="telefono" name="telefono" value="" size="15" placeholder="+3465656565" required>
             </div>
             <div class="grupoFormulario">
                 <label for="informacion">Solicita más información:</label>
                 <textarea name="informacion" id="informacion" rows="6" cols="60" required></textarea>
             </div>
             <div class="checkbox">
                 <input type="checkbox" id="checkbox" name="checkbox" value="" required>
                 <label for="checkbox">Acepto la política de privacidad.</label>
             </div>
             <input class="enviar" type="submit" id="enviar" name="enviar" value="Enviar">
         </form>
